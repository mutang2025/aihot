[project]
name = "aihot-backend"
version = "0.1.0"
description = "AI 每日热点新闻聚合 - 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "openai>=1.58",
    "numpy>=2.2",
    "scikit-learn>=1.6",
    "loguru>=0.7.0",
    "redis>=5.2",
    "arq>=0.26",
    "python-multipart>=0.0.20",
    "apscheduler>=3.11",
    "tenacity>=9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
